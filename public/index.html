<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    RU Aracı Takımı Satış Dashboard’u
  </title>

  <link
    rel="stylesheet"
    href="/styles.css"
  >
</head>

<body>

  <div id="loginScreen">

    <div
      style="
        min-height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        background:#173957;
        padding:20px;
        font-family:Arial,Helvetica,sans-serif;
      "
    >

      <form
        id="loginForm"
        autocomplete="on"
        style="
          width:490px;
          max-width:100%;
          background:#ffffff;
          padding:40px;
          border-radius:20px;
          box-shadow:0 20px 60px rgba(0,0,0,.20);
        "
      >

        <h1
          style="
            margin:0 0 30px;
            color:#111827;
            font-size:38px;
            line-height:1.15;
          "
        >
          RU Aracı Takımı<br>
          Satış Dashboard’u
        </h1>


        <input
          id="username"
          name="username"
          type="text"
          placeholder="Kullanıcı adı"
          autocomplete="username"
          required

          style="
            display:block;
            width:100%;
            height:50px;
            box-sizing:border-box;
            margin-bottom:14px;
            padding:0 14px;
            border:1px solid #94a3b8;
            border-radius:0;
            background:#eef4ff;
            color:#111827;
            font-size:16px;
          "
        >


        <input
          id="password"
          name="password"
          type="password"
          placeholder="Şifre"
          autocomplete="current-password"
          required

          style="
            display:block;
            width:100%;
            height:50px;
            box-sizing:border-box;
            margin-bottom:18px;
            padding:0 14px;
            border:1px solid #94a3b8;
            border-radius:0;
            background:#eef4ff;
            color:#111827;
            font-size:16px;
          "
        >


        <button
          id="loginButton"
          type="submit"

          style="
            display:block;
            width:100%;
            height:48px;
            border:none;
            border-radius:10px;
            background:#2f70ad;
            color:#ffffff;
            font-size:16px;
            font-weight:800;
            cursor:pointer;
          "
        >
          Giriş Yap
        </button>


        <div
          id="loginError"

          style="
            display:none;
            margin-top:14px;
            padding:11px 12px;
            border-radius:8px;
            background:#fff0f0;
            color:#b42318;
            font-size:13px;
          "
        ></div>


        <div
          id="loginInfo"

          style="
            display:none;
            margin-top:14px;
            padding:11px 12px;
            border-radius:8px;
            background:#eef7ff;
            color:#245a85;
            font-size:13px;
          "
        ></div>

      </form>

    </div>

  </div>


  <script
    src="/login.js"
    defer
  ></script>

</body>
</html>
